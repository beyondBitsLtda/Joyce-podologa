project_id = "passo-leve"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cadastro é feito pela administradora da clínica, não por auto-registro:
# ninguém deve conseguir criar conta e entrar no prontuário sozinho.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
